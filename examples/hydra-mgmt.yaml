# The reference lab's management cluster (ADR-007, PET-74) expressed as
# hydra.yaml. Rendering it reproduces the ~440-line manifest that was written
# by hand to build hydra-mgmt; testdata/ holds the expected output.
#
# Every value below is specific to one site (the hypervisor's bridge and pool,
# an address outside that site's DHCP range). Change all of them for yours.
apiVersion: hydra.io/v1alpha1
kind: ClusterConfig
metadata:
  name: hydra-mgmt
spec:
  kubernetesVersion: v1.35.3
  storagePool: k8s-workers
  image:
    name: ubuntu-24.04-server-cloudimg-amd64.img
  network:
    controlPlaneEndpoint: 192.168.15.11
    bridges: [br0]
    podCIDR: 10.244.0.0/16
    mtu: 1500
  controlPlane:
    replicas: 3
    vcpus: 2
    memory: 6Gi
    diskSize: 40Gi
