name: E2E

# hydra against a real management cluster, with no lab: `hydra bootstrap`
# creates a kind cluster and installs cert-manager, Cluster API and the Hydra
# provider from its release; every example is then rendered and server-side
# dry-run against it, so a template the CRDs or webhooks reject fails here;
# then `hydra cluster apply` creates a cluster's objects and prunes, refuses
# and keeps what hydra.yaml stops listing. See hack/e2e/run.sh.
on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'examples/**'
      - 'hack/e2e/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  e2e:
    permissions:
      contents: read
    name: kind e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # clusterctl reads the provider's GitHub release metadata; the job token
      # keeps it clear of the anonymous API rate limit shared by the runner.
      - name: Run the e2e test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make e2e

  # hydra's Cilium HelmChartProxy against a real cluster: a CAPD workload
  # cluster with no CNI must go Ready from it, and a ciliumVersion change must
  # upgrade the release. See hack/e2e/cilium.sh.
  cilium:
    permissions:
      contents: read
    name: Cilium e2e (CAPD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # clusterctl reads provider release metadata from GitHub; the job token
      # keeps it clear of the anonymous API rate limit.
      - name: Run the Cilium e2e test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make e2e-cilium
