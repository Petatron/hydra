name: Cilium drift

# internal/render/assets/cilium.yaml is generated by hack/gen-cilium.sh from
# the pinned Cilium chart. Regenerate it and fail if it differs: a hand edit,
# or a chart re-published under the same version, would otherwise go unseen.
# Needs helm and network access, so it runs weekly, on demand, and on PRs that
# touch the generator or the renderer.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'hack/gen-cilium.sh'
      - 'internal/render/**'
      - '.github/workflows/cilium-drift.yml'

permissions: {}

jobs:
  drift:
    permissions:
      contents: read
    name: Embedded Cilium manifest matches the chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Regenerate and compare
        run: make cilium-drift
