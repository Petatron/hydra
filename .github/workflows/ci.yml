name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Tidiness and formatting first: a test run must not hide an untidy go.mod.
      - name: Verify go.mod and formatting
        run: make verify
      # Includes the golden files: any change to rendered output must be
      # committed with its regenerated golden, so it shows up in review.
      - name: Test
        run: make test
      # Fork pull requests do not receive CODECOV_TOKEN, so the upload is
      # skipped there rather than failing a contributor's PR on something they
      # cannot fix. It is also skipped when the secret is simply not set.
      - name: Upload coverage to Codecov
        if: ${{ github.event.pull_request.head.repo.fork != true && env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover.out
          disable_search: true
          fail_ci_if_error: true
      - name: Build
        run: make build

  lint:
    permissions:
      contents: read
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  security:
    permissions:
      contents: read
    name: Vulnerabilities and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Reports only vulnerabilities in code hydra actually calls.
      - name: govulncheck
        run: make vuln
      - name: actionlint
        run: make actionlint

  # A PR that changes VERSION is a release request (PET-92): merging it tags
  # and publishes vX.Y.Z. Refuse a VERSION that is malformed or behind the
  # newest tag before it can reach main.
  version:
    permissions:
      contents: read
    name: VERSION is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the check compares VERSION with every v* tag
      - name: Test hack/version.sh
        run: make test-version

      - name: Check VERSION
        run: |
          msg="$(hack/version.sh check)"
          echo "::notice::$msg"
