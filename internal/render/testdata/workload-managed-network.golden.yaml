# The CNI: Cilium 1.19.1, installed and kept in step by Cluster API Add-on Provider Helm.
# Never removable: removing it uninstalls Cilium from the running cluster.
apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  labels:
    hydra.io/addon: cilium
    hydra.io/cluster: demo
  name: demo-cilium
  namespace: demo
spec:
  chartName: cilium
  clusterSelector:
    matchLabels:
      cni.hydra.io/cilium: demo
  namespace: kube-system
  options:
    takeOwnership: true
  reconcileStrategy: Continuous
  releaseName: cilium
  repoURL: https://helm.cilium.io
  valuesTemplate: |
    MTU: 1500
    cluster:
      id: 0
      name: demo
    hubble:
      tls:
        auto:
          method: cronJob
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList:
        - 10.244.0.0/16
    kubeProxyReplacement: false
    operator:
      replicas: 2
      rollOutPods: true
    rollOutCiliumPods: true
    routingMode: tunnel
    tunnelProtocol: vxlan
  version: 1.19.1
---
# Addon metrics-server 3.14.0, installed and kept in step by Cluster API Add-on Provider Helm.
apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  labels:
    hydra.io/addon: metrics-server
    hydra.io/cluster: demo
  name: demo-metrics-server
  namespace: demo
spec:
  chartName: metrics-server
  clusterSelector:
    matchLabels:
      hydra.io/cluster: demo
  namespace: kube-system
  reconcileStrategy: Continuous
  releaseName: metrics-server
  repoURL: https://kubernetes-sigs.github.io/metrics-server/
  valuesTemplate: |
    args:
    - --kubelet-insecure-tls
  version: 3.14.0
