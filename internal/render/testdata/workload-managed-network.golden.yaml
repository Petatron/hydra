# Rendered by hydra test from hydra.yaml for cluster "demo".
# Do not edit and re-apply by hand: change hydra.yaml and render again.
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: HydraCluster
metadata:
  name: "demo"
  namespace: "demo"
  labels:
    hydra.io/cluster: "demo"
spec:
  storagePool: "vm-pool"
  baseImage:
    name: "hydra-node-ubuntu-24.04-k8s-v1.35.3.qcow2"
  networks:
    - name: "br0"
  # Hydra creates and owns this network; machines get an interface on it in
  # addition to the networks above. Hydra chooses the endpoint on it.
  managedNetwork:
    name: "demo-net"
    subnet: "192.168.70.0/24"
    dhcpStart: "192.168.70.100"
    dhcpEnd: "192.168.70.200"
  hypervisor:
    address: "hypervisor.example.internal:16514"
    # Holds cacert.pem, clientcert.pem and clientkey.pem. Not rendered: key
    # material never appears in render output. It must carry the label
    # clusterctl.cluster.x-k8s.io/move so clusterctl move takes it along.
    credentialsSecretRef:
      name: "demo-libvirt-pki"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: "demo"
  namespace: "demo"
  labels:
    hydra.io/cluster: "demo"
    # Selects the HelmChartProxy that installs Cilium. Never remove it from a
    # running cluster: CAAPH would uninstall Cilium.
    cni.hydra.io/cilium: "demo"
spec:
  clusterNetwork:
    # Propagated by KCP into kubeadm's config, and the same value is Cilium's
    # IPAM pool, so kubeadm and the CNI cannot disagree.
    pods:
      cidrBlocks: ["10.244.0.0/16"]
    services:
      cidrBlocks: ["10.96.0.0/12"]
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: HydraCluster
    name: "demo"
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: "demo-cp"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: HydraMachineTemplate
metadata:
  # Named after its content: the spec is immutable, so a new machine shape is a
  # new template, and KCP rolls the control plane onto it.
  name: "demo-cp-61625b5c"
  namespace: "demo"
  labels:
    hydra.io/cluster: "demo"
spec:
  template:
    spec:
      vcpus: 2
      memory: "4Gi"
      diskSize: "40Gi"
      # Before Cluster API drains a control-plane machine -- and so before KCP
      # removes its etcd member -- the provider runs this in the guest: it
      # hands the control-plane VIP to another node while this one still
      # serves the API (PET-88). Needs provider v0.2.0 or later.
      preDrainHook:
        path: /usr/local/sbin/hydra-pre-drain
        timeoutSeconds: 60
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: "demo-cp"
  namespace: "demo"
  labels:
    hydra.io/cluster: "demo"
spec:
  replicas: 1
  version: "v1.35.3"
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: HydraMachineTemplate
        name: "demo-cp-61625b5c"
      deletion:
        # Removing the VIP holder spends ~40s before its Node delete runs; the
        # 10s default left orphan Nodes behind (PET-22).
        nodeDeletionTimeoutSeconds: 300
  # Stop after three failed replacements instead of looping (PET-22).
  remediation:
    maxRetry: 3
  kubeadmConfigSpec:
    files:
      # kubeadm's preflight needs these on disk; `sysctl --system` only applies
      # what is there.
      - path: /etc/modules-load.d/k8s.conf
        owner: root:root
        permissions: "0644"
        content: |
          overlay
          br_netfilter
      - path: /etc/sysctl.d/k8s.conf
        owner: root:root
        permissions: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
      # Kubelet graceful node shutdown (PET-69), applied as a kubeadm patch;
      # patches.directory below must name this file's directory.
      - path: /etc/kubeadm/patches/kubeletconfiguration0+merge.yaml
        owner: root:root
        permissions: "0644"
        content: |
          shutdownGracePeriod: 60s
          shutdownGracePeriodCriticalPods: 30s
      # Lets the kubelet's shutdown delay lock last shutdownGracePeriod; the
      # zz- prefix sorts after unattended-upgrades' 30s drop-in (PET-69).
      - path: /etc/systemd/logind.conf.d/zz-hydra-graceful-shutdown.conf
        owner: root:root
        permissions: "0644"
        content: |
          [Login]
          InhibitDelayMaxSec=60
      # Run by the provider before this machine is drained (preDrainHook on
      # the control-plane template, PET-88). If this node holds the VIP and
      # another control-plane node is Ready, it stops kube-vip here, waits
      # until another node holds kube-vip's lease, then drops the VIP from
      # this node. kube-vip v0.8.9 neither releases its lease nor removes the
      # address when stopped, so both are done here. Idempotent.
      - path: /usr/local/sbin/hydra-pre-drain
        owner: root:root
        permissions: "0755"
        content: |
          #!/bin/sh
          set -u
          IFACE=enp2s0
          # Overridable only so the render tests can run this script.
          MANIFEST=${MANIFEST:-/etc/kubernetes/manifests/kube-vip.yaml}
          PARKED=${PARKED:-/etc/kubernetes/kube-vip.yaml.pre-drain}
          # One deadline for all of it, well inside the provider's timeout
          # (60s), which releases the hook whether or
          # not this has finished: listing nodes gets the first quarter, the
          # lease hand-over runs to three quarters, removing the address to the
          # end.
          BUDGET=${BUDGET:-45}
          START=$(date +%s)
          LIST_END=$(( START + BUDGET / 4 ))
          LEASE_END=$(( START + BUDGET * 3 / 4 ))
          DEADLINE=$(( START + BUDGET ))
          NODE=$(hostname)
          src=$MANIFEST; [ -f "$src" ] || src=$PARKED
          if [ ! -f "$src" ]; then echo "no kube-vip manifest: nothing to hand over"; exit 0; fi
          VIP=$(awk '/- name: address$/ { getline; gsub(/"/, "", $2); print $2; exit }' "$src")
          if [ -z "$VIP" ]; then echo "no VIP address in $src"; exit 1; fi
          # The endpoint may be a DNS name; kube-vip puts the address it
          # resolves to on the interface, so compare and remove that.
          case "$VIP" in
            *[!0-9.]*)
              name=$VIP
              VIP=$(getent ahostsv4 "$name" | awk 'NR == 1 { print $1 }')
              if [ -z "$VIP" ]; then echo "cannot resolve $name: keeping kube-vip"; exit 1; fi ;;
          esac
          if ! ip -4 -o addr show dev "$IFACE" | grep -q " $VIP/"; then echo "$NODE does not hold $VIP"; exit 0; fi
          # This node's own API server: the way in that does not depend on the VIP.
          K="kubectl --kubeconfig /etc/kubernetes/admin.conf --server https://127.0.0.1:6443 --tls-server-name kubernetes --request-timeout=3s"
          # Only a list that succeeded may say there is nobody to hand over
          # to; one that keeps failing leaves kube-vip and the VIP alone.
          nodes=""
          until nodes=$($K get nodes -l node-role.kubernetes.io/control-plane \
            -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'); do
            if [ "$(date +%s)" -ge "$LIST_END" ]; then echo "cannot list control-plane nodes: keeping $VIP"; exit 1; fi
            sleep 1
          done
          others=$(printf '%s\n' "$nodes" | grep -v "^$NODE=" | grep -c '=True$')
          if [ "$others" -eq 0 ]; then echo "no other Ready control-plane node: keeping $VIP"; exit 0; fi
          [ -f "$MANIFEST" ] && mv -f "$MANIFEST" "$PARKED"
          while :; do
            h=$($K -n kube-system get lease plndr-cp-lock -o jsonpath='{.spec.holderIdentity}' 2>/dev/null)
            if [ -n "$h" ] && [ "$h" != "$NODE" ]; then break; fi
            if [ "$(date +%s)" -ge "$LEASE_END" ]; then
              # Nobody took over: run kube-vip here again, so this node goes
              # on serving the VIP it still holds.
              mv -f "$PARKED" "$MANIFEST"
              echo "lease still on $NODE: kube-vip restored, keeping $VIP"
              exit 1
            fi
            sleep 0.5
          done
          # Another node holds the lease now: keep removing the address until
          # it is gone, or until the deadline.
          while :; do
            ip addr del "$VIP/32" dev "$IFACE" 2>/dev/null
            if ! ip -4 -o addr show dev "$IFACE" | grep -q " $VIP/"; then
              echo "handed $VIP to $h"
              exit 0
            fi
            [ "$(date +%s)" -ge "$DEADLINE" ] && break
            sleep 1
          done
          echo "$h holds the lease, but $VIP could not be removed from $IFACE"
          exit 1
      - path: /etc/kubernetes/manifests/kube-vip.yaml
        owner: root:root
        permissions: "0644"
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: kube-vip
            namespace: kube-system
          spec:
            containers:
              - name: kube-vip
                image: ghcr.io/kube-vip/kube-vip:v0.8.9
                imagePullPolicy: IfNotPresent
                args: ["manager"]
                env:
                  - name: vip_arp
                    value: "true"
                  # Filled in at boot from the cluster's endpoint, like
                  # `address` below.
                  - name: port
                    value: "@CONTROL_PLANE_PORT@"
                  - name: vip_interface
                    value: "enp2s0"
                  - name: vip_cidr
                    value: "32"
                  - name: cp_enable
                    value: "true"
                  - name: cp_namespace
                    value: "kube-system"
                  - name: vip_ddns
                    value: "false"
                  - name: svc_enable
                    value: "false"
                  - name: vip_leaderelection
                    value: "true"
                  # kube-vip's own defaults. A CP that is destroyed outright --
                  # a crash, or KCP removing its machine -- never releases the
                  # lease, so the others wait out the lease before claiming the
                  # VIP: at 15/10/2 that was a 10-20s API outage (PET-22).
                  - name: vip_leaseduration
                    value: "5"
                  - name: vip_renewdeadline
                    value: "3"
                  - name: vip_retryperiod
                    value: "1"
                  # The address this node claims when it leads. Filled in at boot
                  # from the cluster's endpoint by preKubeadmCommands below, so
                  # it is the HydraCluster's value whether that was stated or
                  # chosen by Hydra.
                  - name: address
                    value: "@CONTROL_PLANE_HOST@"
                securityContext:
                  capabilities:
                    add: ["NET_ADMIN", "NET_RAW", "SYS_TIME"]
                volumeMounts:
                  - mountPath: /etc/kubernetes/admin.conf
                    name: kubeconfig
            hostAliases:
              - hostnames: ["kubernetes"]
                ip: 127.0.0.1
            hostNetwork: true
            volumes:
              - name: kubeconfig
                hostPath:
                  path: /etc/kubernetes/admin.conf
    initConfiguration:
      nodeRegistration:
        criSocket: unix:///run/containerd/containerd.sock
      patches:
        directory: /etc/kubeadm/patches
    joinConfiguration:
      nodeRegistration:
        criSocket: unix:///run/containerd/containerd.sock
      patches:
        directory: /etc/kubeadm/patches
    preKubeadmCommands:
      # providerID from the SMBIOS UUID libvirt published as the domain UUID.
      - |
        # --node-ip is not optional here, and the reason is kube-vip.
        #
        # The VIP is added as a second address on enp2s0 of whichever node holds
        # leadership. Left to itself the kubelet picked that address and
        # registered the VIP as the node's InternalIP -- so the node's
        # identity was an address that moves to a different machine on failover.
        # Captured here, before kubeadm starts the kubelet and kube-vip with it,
        # while enp1s0 still has only its own DHCP address.
        NODE_IP=$(ip -4 -o addr show enp1s0 | awk '{print $4}' | cut -d/ -f1 | head -1)
        printf 'KUBELET_EXTRA_ARGS=--provider-id=hydra://libvirt/%s --node-ip=%s\n' \
          "$(tr 'A-Z' 'a-z' < /sys/class/dmi/id/product_uuid)" \
          "$NODE_IP" \
          > /etc/default/kubelet
      - modprobe overlay
      - modprobe br_netfilter
      - sysctl --system
      # bootstrap: prebaked -- the image carries containerd (systemd cgroups),
      # kubelet/kubeadm/kubectl v1.35.3 and qemu-guest-agent (PET-77).
      # No package mirror is contacted at boot.
      # Enable, not start: kubeadm starts the kubelet, but never enables it, and
      # a node that reboots must rejoin (PET-56).
      - systemctl enable kubelet
      # Give kube-vip the endpoint CABPK wrote into kubeadm's own config, so it
      # is stated once (on the HydraCluster) and covers a Hydra-chosen endpoint.
      # No endpoint found stops cloud-init before kubeadm waits on a dead VIP.
      - |
        if [ -f /etc/kubernetes/manifests/kube-vip.yaml ]; then
          for f in /run/kubeadm/kubeadm.yaml /run/kubeadm/kubeadm-join-config.yaml; do
            [ -z "${ENDPOINT:-}" ] && [ -f "$f" ] &&
              ENDPOINT=$(awk '$1 == "controlPlaneEndpoint:" || $1 == "apiServerEndpoint:" { gsub(/["\047]/, "", $2); print $2; exit }' "$f")
          done
          case "${ENDPOINT:-}" in
            ?*:?*) ;;
            *) echo "kube-vip: no control-plane endpoint in /run/kubeadm" >&2; exit 1 ;;
          esac
          HOST=${ENDPOINT%:*}
          HOST=${HOST#\[}
          HOST=${HOST%\]}
          sed -i -e "s/@CONTROL_PLANE_HOST@/$HOST/" -e "s/@CONTROL_PLANE_PORT@/${ENDPOINT##*:}/" \
            /etc/kubernetes/manifests/kube-vip.yaml
        fi
      # kubeadm 1.29+ admin.conf is not cluster-admin; kube-vip needs
      # super-admin.conf during init, and gets admin.conf back afterwards.
      - |
        if [ -f /etc/kubernetes/manifests/kube-vip.yaml ]; then
          sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' \
            /etc/kubernetes/manifests/kube-vip.yaml
        fi
    postKubeadmCommands:
      - |
        if [ -f /etc/kubernetes/manifests/kube-vip.yaml ]; then
          sed -i 's#path: /etc/kubernetes/super-admin.conf#path: /etc/kubernetes/admin.conf#' \
            /etc/kubernetes/manifests/kube-vip.yaml
        fi
---
# Replaces a failed control-plane machine; KCP remediates one at a time and
# never at the cost of etcd quorum (PET-22).
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: "demo-cp-unhealthy"
  namespace: "demo"
  labels:
    hydra.io/cluster: "demo"
spec:
  clusterName: "demo"
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: "demo"
      cluster.x-k8s.io/control-plane: ""
  checks:
    # Ten minutes. With bootstrap: packages a slow package mirror can exceed
    # it and loop replacements (PET-77); bootstrap: prebaked removes that.
    nodeStartupTimeoutSeconds: 600
    # Five minutes absorbs a reboot or a network blip and still replaces a
    # dead machine promptly.
    unhealthyNodeConditions:
      - type: Ready
        status: Unknown
        timeoutSeconds: 300
      - type: Ready
        status: "False"
        timeoutSeconds: 300
  remediation:
    triggerIf:
      # Stand down, visibly, once more members are unhealthy than etcd can lose
      # and keep quorum ((replicas-1)/2, at least 1). Several failing at once
      # usually share a cause that replacing machines will not fix.
      unhealthyLessThanOrEqualTo: 1
