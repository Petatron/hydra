# The canonical Cilium values for every Hydra cluster (PET-94).
#
# hack/gen-cilium.sh renders the embedded manifest from these, and the same
# values are what any other installer of Cilium on a Hydra cluster must use:
# Argo CD (hydra-gitops), a Helm release, and later the addon controller
# (PET-95). Change them here, in a reviewed PR, and nowhere else.
#
# This file is a TEMPLATE, not values to install as they are. The values that
# differ per cluster are sentinels the CLI substitutes when it renders a
# cluster; `helm upgrade -f` of this file unchanged would install the sentinels
# (and an MTU outside what hydra.yaml accepts). Another installer copies the
# shared settings and sets these four from the cluster's hydra.yaml:
#
#   cluster.name                                hydra-sentinel-cluster  -> metadata.name
#   ipam.operator.clusterPoolIPv4PodCIDRList[0] 10.255.254.0/24         -> spec.network.podCIDR
#   MTU                                         65000                   -> spec.network.mtu
#   operator.replicas                           1                       -> 2 when the cluster always has
#                                                                          at least 2 nodes, otherwise 1
#
# Hubble's TLS certificates are issued in the cluster by Cilium's certgen
# CronJob. Helm-generated certs would put a private key into every rendered
# manifest and change on every render, so render would stop being
# deterministic and every sync would show a diff.
cluster:
  name: hydra-sentinel-cluster # sentinel: the cluster's metadata.name
  id: 0
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.255.254.0/24 # sentinel: spec.network.podCIDR
MTU: 65000 # sentinel: spec.network.mtu (1500 by default)
kubeProxyReplacement: false
routingMode: tunnel
tunnelProtocol: vxlan
operator:
  # sentinel: the manifest is rendered with 1 and the CLI raises it to 2 when
  # the cluster always has at least 2 nodes (render.OperatorReplicas). Set the
  # integer directly elsewhere: 2 for hydra-mgmt and hydra-wl0 (3 control-plane
  # nodes each), never this 1 copied as it is.
  replicas: 1
hubble:
  tls:
    auto:
      method: cronJob
